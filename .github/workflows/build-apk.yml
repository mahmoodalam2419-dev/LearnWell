name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21 (no auto-detection)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          java-version-file: ''  # ← prevents error

      - name: Install Android SDK tools
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install dependencies
        run: npm install

      - name: Unzip audio
        run: |
          mkdir -p www/audio
          unzip -o audio.zip -d www/audio

      - name: Add Android project
        run: yes | npx cap add android

      - name: Patch AndroidManifest.xml & strings.xml
        run: node patch-android.js

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "org.gradle.java.home=$JAVA_HOME" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TSH-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
